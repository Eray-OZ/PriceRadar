name: PriceRadar Price Check

on:
  workflow_dispatch:

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  price-check:
    runs-on: ubuntu-latest

    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.ConnectionStrings__DefaultConnection }}
      TelegramBotToken: ${{ secrets.TelegramBotToken }}
      ChatId: ${{ secrets.ChatId }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show checked-out commit
        run: |
          git log -1 --format='Commit: %H%nMessage: %s'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify required secrets
        env:
          DB_CONNECTION: ${{ secrets.ConnectionStrings__DefaultConnection }}
          TELEGRAM_TOKEN: ${{ secrets.TelegramBotToken }}
          TELEGRAM_CHAT_ID: ${{ secrets.ChatId }}
        run: |
          test -n "$DB_CONNECTION" || { echo "::error::ConnectionStrings__DefaultConnection is missing or empty"; exit 1; }
          test -n "$TELEGRAM_TOKEN" || { echo "::error::TelegramBotToken is missing or empty"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::ChatId is missing or empty"; exit 1; }

      - name: Restore Worker
        run: dotnet restore PriceRadar.Worker/PriceRadar.Worker.csproj

      - name: Build Worker
        run: dotnet build PriceRadar.Worker/PriceRadar.Worker.csproj --configuration Release --no-restore

      - name: Install Playwright Chrome
        run: pwsh PriceRadar.Scraping/bin/Release/net10.0/playwright.ps1 install chrome --with-deps

      - name: Run Worker
        run: dotnet run --project PriceRadar.Worker/PriceRadar.Worker.csproj --configuration Release --no-build
