name: HBTracker Price Check

on:
  workflow_dispatch:

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  price-check:
    runs-on: ubuntu-latest

    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.ConnectionStrings__DefaultConnection }}
      TelegramBotToken: ${{ secrets.TelegramBotToken }}
      ChatId: ${{ secrets.ChatId }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore Worker
        run: dotnet restore HBTracker.Worker/HBTracker.Worker.csproj

      - name: Build Worker
        run: dotnet build HBTracker.Worker/HBTracker.Worker.csproj --configuration Release --no-restore

      - name: Install Playwright Chrome
        run: pwsh HBTracker.Scraping/bin/Release/net10.0/playwright.ps1 install chrome --with-deps

      - name: Run Worker
        run: dotnet run --project HBTracker.Worker/HBTracker.Worker.csproj --configuration Release --no-build
